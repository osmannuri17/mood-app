html,body{margin:0;height:100%;background:#03040d;overflow:hidden}
svg{width:100vw;height:100vh;display:block}
.basla rect{opacity:0;transform-box:fill-box;transform-origin:center;animation:p 0.45s ease-in-out forwards}
@keyframes p{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:scale(1)}}
.yazi{font-family:'Dancing Script','Great Vibes','Segoe Script',cursive;font-size:104px;font-weight:700;fill:#fff;
  filter:drop-shadow(0 2px 0 #b0185a) drop-shadow(0 0 6px #ff2d87) drop-shadow(0 0 16px rgba(255,45,135,.8));
  opacity:0}
.basla .yazi{animation:y 5s ease-in-out forwards}
@keyframes y{0%{opacity:0;letter-spacing:12px}100%{opacity:1;letter-spacing:1px}}

#soru{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:24px;box-sizing:border-box;
  font-family:'Arial Black',Arial,sans-serif;color:#fff;text-align:center;transition:opacity .6s ease-in-out;z-index:5}
#soru h1{font-family:'Arial Black','Arial Bold',Impact,'Helvetica Neue',Arial,sans-serif;font-size:clamp(30px,7.5vw,64px);font-weight:900;margin:0;color:#fff;line-height:1.2;letter-spacing:.5px;padding:18px 26px;border-radius:22px;background:rgba(255,79,154,.18);border:2px solid rgba(255,79,154,.55);text-shadow:0 3px 0 #b0185a,0 0 18px rgba(255,79,154,.8)}
#butonlar{display:flex;gap:28px;align-items:center;justify-content:center}
#butonlar button{font-family:'Arial Black',Arial,system-ui,sans-serif;font-size:24px;font-weight:900;min-width:130px;min-height:60px;
  padding:14px 28px;border-radius:999px;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#evet{background:#ff4f9a;color:#fff;box-shadow:0 0 20px rgba(255,79,154,.7)}
#hayir{background:#3a3a3a;color:#fff;border:2px solid #777 !important;transition:transform .12s ease-out;position:relative}
#sahne{display:none}
#hayir.sars{animation:sars .35s ease-in-out}
@keyframes sars{0%,100%{rotate:0deg}20%{rotate:-12deg}40%{rotate:10deg}60%{rotate:-7deg}80%{rotate:4deg}}

#gok{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#1a2a5e 0%,#0b1233 45%,#03040d 100%)}
#gunes{position:absolute;top:6%;right:8%;width:min(22vw,150px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#fff7b0 0%,#ffe066 45%,#ffc93c 70%);box-shadow:0 0 60px 25px rgba(255,224,102,.65),0 0 140px 60px rgba(255,236,150,.35)}
.bulut{position:absolute;background:#fff;border-radius:100px;opacity:.92;filter:drop-shadow(0 6px 8px rgba(0,60,120,.12));animation:suzul linear infinite}
.bulut::before,.bulut::after{content:"";position:absolute;background:#fff;border-radius:50%}
.bulut::before{width:55%;height:180%;left:12%;top:-90%}
.bulut::after{width:40%;height:140%;right:12%;top:-60%}
@keyframes suzul{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.yildiz{position:absolute;width:var(--s);height:var(--s);background:#fff;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
  filter:drop-shadow(0 0 4px #fff);animation:parilda ease-in-out infinite}
@keyframes parilda{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
#soru,#sahne{position:relative;z-index:1}
#soru{position:fixed}

<script>
const hayir=document.getElementById('hayir'), evet=document.getElementById('evet');
let ox=0, oy=0;
function kac(e){
  if(e){e.preventDefault();e.stopPropagation();}
  // Buton yerinde kalır, ama her dokunuşta aşağı-yukarı, sağa-sola kayar
  const r=hayir.getBoundingClientRect();
  const bx=r.left-ox, by=r.top-oy;            // butonun asıl yeri
  const M=12, W=innerWidth, H=innerHeight;
  let nx, ny, deneme=0;
  do{
    const ang=Math.random()*Math.PI*2, d=110+Math.random()*120;
    nx=ox+Math.cos(ang)*d; ny=oy+Math.sin(ang)*d;
    // ekranın içinde ve asıl yerinin yakınında kalsın
    nx=Math.max(-bx+M, Math.min(W-r.width-bx-M, nx));
    ny=Math.max(-by+M, Math.min(H-r.height-by-M, ny));
    deneme++;
  }while(Math.hypot(nx-ox, ny-oy) < 60 && deneme<20);
  ox=nx; oy=ny;
  hayir.style.transform=`translate(${ox}px, ${oy}px)`;
  hayir.classList.remove('sars'); void hayir.offsetWidth; hayir.classList.add('sars');
}
['pointerenter','pointerdown','touchstart','mouseover','click','focus'].forEach(ev=>hayir.addEventListener(ev,kac,{passive:false}));
evet.addEventListener('click',()=>{
  const soru=document.getElementById('soru');
  soru.style.opacity='0'; soru.style.pointerEvents='none'; hayir.style.display='none';
  setTimeout(()=>{soru.style.display='none';
    const sahne=document.getElementById('sahne'); sahne.style.display='block';
    void sahne.offsetWidth; document.body.classList.add('basla');},600);
});
</script>
