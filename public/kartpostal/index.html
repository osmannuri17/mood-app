<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZAZ İzmir Kartpostal – 3D Önizleme</title>
<style>
:root{--bg1:#efe9e1;--bg2:#cfc4b6;--ink:#3b342d;--muted:#7a6f63;--btn:#fffaf3;--btnb:#d8cdbf;--accent:#D7262E;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a2622;--bg2:#141210;--ink:#efe7dc;--muted:#a3988b;--btn:#2b2724;--btnb:#4a433c}}
:root[data-theme="dark"]{--bg1:#2a2622;--bg2:#141210;--ink:#efe7dc;--muted:#a3988b;--btn:#2b2724;--btnb:#4a433c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(ellipse at 50% 38%,var(--bg1) 0%,var(--bg2) 100%);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden;display:flex;flex-direction:column}
header{text-align:center;padding:14px 12px 0}
header h1{margin:0;font-size:13px;letter-spacing:3px;font-weight:600;color:var(--muted)}
#side{margin-top:6px;font-size:18px;letter-spacing:2px;font-weight:700}
#stage{flex:1;display:flex;align-items:center;justify-content:center;perspective:1500px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;min-height:0}
#stage.drag{cursor:grabbing}
#card{--h:min(86vh,calc(84vw * 958 / 478));height:var(--h);width:calc(var(--h) * 478 / 958);position:relative;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:5px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.18)}
.glare{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.28) 48%,rgba(255,255,255,0) 62%);background-size:260% 100%;mix-blend-mode:soft-light}
.edge{position:absolute;background:#f1ece4}
#shadow{position:absolute;left:50%;bottom:-6%;width:90%;height:7%;transform:translateX(-50%) translateZ(-200px);border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.35),rgba(0,0,0,0) 70%);filter:blur(8px);pointer-events:none}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 12px 6px}
button{font:600 14px/1 inherit;font-family:inherit;letter-spacing:1px;padding:12px 18px;border-radius:999px;border:1px solid var(--btnb);background:var(--btn);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.hint{text-align:center;font-size:12px;color:var(--muted);padding:0 12px 14px}
</style>
</head>

<script>
(function(){
const card=document.getElementById('card'),stage=document.getElementById('stage');
const glares=[...document.querySelectorAll('.glare')];
// thickness edges
const T=3;
function edges(){card.querySelectorAll('.edge').forEach(e=>e.remove());
 const w=card.offsetWidth,h=card.offsetHeight;
 const mk=(css)=>{const d=document.createElement('div');d.className='edge';Object.assign(d.style,css);card.appendChild(d)};
 mk({width:T+'px',height:h+'px',left:(w/2-T/2)+'px',top:0,transform:'rotateY(90deg) translateZ('+(w/2)+'px)'});
 mk({width:T+'px',height:h+'px',left:(w/2-T/2)+'px',top:0,transform:'rotateY(-90deg) translateZ('+(w/2)+'px)'});
 mk({width:w+'px',height:T+'px',left:0,top:(h/2-T/2)+'px',transform:'rotateX(90deg) translateZ('+(h/2)+'px)'});
 mk({width:w+'px',height:T+'px',left:0,top:(h/2-T/2)+'px',transform:'rotateX(-90deg) translateZ('+(h/2)+'px)'});
 document.getElementById('front').style.transform='translateZ('+T/2+'px)';
 document.getElementById('back').style.transform='rotateY(180deg) translateZ('+T/2+'px)';
}
edges();addEventListener('resize',edges);
let ry=-18,rx=6,vy=0,vx=0,dragging=false,lx=0,ly=0,lt=0,target=null;
function render(){
 card.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)';
 const n=((ry%360)+360)%360; const isBack=n>90&&n<270;
 const g=50+((n%180)-90)*0.9; glares.forEach(el=>el.style.backgroundPosition=g+'% 0');
}
function loop(){
 if(!dragging){
  if(target!==null){ry+=(target-ry)*0.12;rx+=(4-rx)*0.12;if(Math.abs(target-ry)<0.05){ry=target;target=null}}
  else if(Math.abs(vy)>0.05||Math.abs(vx)>0.05){ry+=vy;rx=Math.max(-35,Math.min(35,rx+vx));vy*=0.94;vx*=0.9;if(Math.abs(vy)<0.6&&Math.abs(vx)<0.6){vy=vx=0;snap()}}
 }
 render();requestAnimationFrame(loop);
}
function snap(){target=Math.round(ry/180)*180}
function goto(face){const base=Math.round(ry/360)*360;let t=base+(face==='back'?180:0);
 if(face==='back'&&Math.abs(t-ry)>180)t-=360; target=t}
stage.addEventListener('pointerdown',e=>{dragging=true;target=null;vy=vx=0;lx=e.clientX;ly=e.clientY;lt=performance.now();stage.setPointerCapture(e.pointerId);stage.classList.add('drag')});
stage.addEventListener('pointermove',e=>{if(!dragging)return;const now=performance.now(),dt=Math.max(1,now-lt);
 const dx=e.clientX-lx,dy=e.clientY-ly;ry+=dx*0.45;rx=Math.max(-35,Math.min(35,rx-dy*0.3));
 vy=dx*0.45*16/dt;vx=-dy*0.3*16/dt;lx=e.clientX;ly=e.clientY;lt=now});
const end=()=>{if(!dragging)return;dragging=false;stage.classList.remove('drag');if(Math.abs(vy)<0.6)snap()};
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
stage.addEventListener('dblclick',()=>{target=Math.round(ry/180)*180+180});
render();loop();setTimeout(()=>{target=0},400);
})();
</script>
